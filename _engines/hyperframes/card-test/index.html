<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #0b1220;
        --ink: #ffffff;
        --accent: #f97316;
        --muted: #94a3b8;
        --font-display: "Segoe UI", Arial, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px; height: 1080px; overflow: hidden;
        background: radial-gradient(circle at 30% 30%, #1e293b 0%, var(--ground) 70%);
      }
      #root { width: 100%; height: 100%; position: relative; font-family: var(--font-display); }
      #card {
        position: absolute; left: 120px; bottom: 160px;
        display: flex; align-items: stretch;
      }
      #bar { width: 14px; background: var(--accent); border-radius: 4px; }
      #panel {
        background: rgba(15, 23, 42, 0.92); padding: 36px 56px 36px 40px;
        border-radius: 0 16px 16px 0; box-shadow: 0 20px 60px rgba(0,0,0,.5);
      }
      #kicker { color: var(--accent); font-size: 28px; font-weight: 700; letter-spacing: 6px; }
      #headline { color: var(--ink); font-size: 84px; font-weight: 900; line-height: 1.05; margin-top: 8px; }
      #sub { color: var(--muted); font-size: 34px; margin-top: 12px; }
      #stat {
        position: absolute; right: 140px; top: 160px; text-align: right;
        color: var(--ink); font-size: 150px; font-weight: 900;
      }
      #stat small { display: block; font-size: 30px; color: var(--muted); font-weight: 600; letter-spacing: 4px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3"
         data-width="1920" data-height="1080">
      <div id="card" class="clip" data-start="0" data-duration="3" data-track-index="0">
        <div id="bar"></div>
        <div id="panel">
          <div id="kicker">ENGINE TEST</div>
          <div id="headline">HyperFrames Online</div>
          <div id="sub">Styled overlay &amp; graphic card render</div>
        </div>
      </div>
      <div id="stat" class="clip" data-start="0" data-duration="3" data-track-index="1">
        <small>READY</small><span id="num">0</span>/5
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#bar", { scaleY: 0, transformOrigin: "bottom" }, { scaleY: 1, duration: 0.35, ease: "power3.out" }, 0)
        .fromTo("#panel", { x: -80, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.15)
        .fromTo(["#kicker", "#headline", "#sub"], { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, stagger: 0.12, ease: "power2.out" }, 0.35)
        .fromTo("#stat", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2)" }, 0.6)
        .to("#num", { innerText: 5, snap: { innerText: 1 }, duration: 1.2, ease: "power1.out" }, 0.8)
        .to("#card, #stat", { opacity: 0, duration: 0.3 }, 2.7);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
